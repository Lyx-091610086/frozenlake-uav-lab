name: Test and deploy FrozenLake Demo

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tests/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Test engine, learning rules, checkpoint and archived data
        run: node --test tests/engine.test.cjs
      - name: Validate static asset paths
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote
          root = Path("docs").resolve()
          refs = []
          class Resources(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  for key in ("src", "href", "poster"):
                      if key in values:
                          refs.append(values[key])
          parser = Resources()
          parser.feed((root / "index.html").read_text())
          for ref in refs:
              url = urlsplit(ref)
              if url.scheme or url.netloc or not url.path:
                  continue
              assert not url.path.startswith("/"), f"Root-relative URL: {ref}"
              target = (root / unquote(url.path)).resolve()
              assert target.is_relative_to(root), f"Resource escapes docs: {ref}"
              assert target.is_file(), f"Missing resource: {ref}"
          for mode in ("deterministic", "stochastic", "weighted"):
              for suffix in ("mp4", "jpg"):
                  assert (root / "assets" / f"flight-{mode}.{suffix}").is_file()
          print("Relative URLs and all flight assets verified.")
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static demo
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
